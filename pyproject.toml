[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ate-paper-artifact"
version = "0.1.0"
description = "Fixed predictions and analysis artifacts for Beyond Aggregate Scores in ATE"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest==9.0.3"]
analysis = ["numpy==2.4.6", "scipy==1.17.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

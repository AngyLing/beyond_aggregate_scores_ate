# Exact dependency versions for independent installation profiles.
# Install one profile per virtual environment with scripts/install_dependencies.py.
# The profiles retain different versions required by their recorded recipes.

# Versions used for local raw gold-ID analysis, Python 3.11.
[analysis]
python = "3.11.5"
cuda = "none"
platform = "CPU"
requirements = [
  "numpy==2.4.6",
  "scipy==1.17.1",
]

# Canonical article supervised environment: all 155 future supervised runs.
# CPython 3.13.15 (standard GIL build), Linux x86_64, glibc >= 2.28.
# Core versions preserve the recorded CL environment; all 55 pins and 69 active
# dependency constraints match the official package metadata.
# Install into a dedicated virtual environment; never the global interpreter.
[supervised-cu128]
python = "3.13.15"
cuda = "12.8"
platform = "CPython with GIL; Linux x86_64, glibc >= 2.28, NVIDIA driver compatible with CUDA 12.8"
